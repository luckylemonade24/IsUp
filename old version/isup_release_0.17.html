<body><div class="container"><div class="header"><h1>Is<span class="text-green">Up</span></h1><div class="header-right"><label class="theme-toggle" aria-label="切换明暗主题"><input type="checkbox" id="themeToggle"><svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg><svg class="moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></label></div></div><div class="overall-card card"><div class="overall-status green"><div class="dot dot-lg"><div class="core"></div><div class="ring"></div></div><span id="overallText">All systems <span class="green">Operational</span></span></div></div><div class="services-title">Services</div><div class="card" id="monitorCard"><div class="placeholder loading">⏳ Loading...</div></div><div class="footer"><div class="footer-left"><a href="https://github.com/luckylemonade24/IsUp" target="_blank" rel="noopener">v0.16</a></div><div class="footer-right"><span>data from</span><span class="dot-green"></span><span class="uptime-robot"><a href="https://uptimerobot.com/" target="_blank" rel="noopener">UptimeRobot</a></span></div></div></div><script>
const formatPercent=v=>v!=null?(String(v).includes('%')?v:v+'%'):'?%';const MONITOR_ID=document.querySelector('meta[name="monitor-id"]').content;(()=>{const root=document.documentElement,systemTheme=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light',$=id=>document.getElementById(id),themeToggle=$('themeToggle'),monitorCard=$('monitorCard');let overallText=$('overallText');const overallStatus=document.querySelector('.overall-status');const statusConfig={success:['Up','green'],danger:['Down','red'],notchecked:['None','gray'],paused:['Paused','gray'],operational:['All systems Operational','green'],someDown:['Some systems down','orange'],allDown:['All systems down','red'],pausedOverall:['Some systems paused','gray'],unknown:['Unknown status','gray']};const getCurrentTheme=()=>root.getAttribute('data-theme')||systemTheme;const setTheme=mode=>{mode==='system'?(root.removeAttribute('data-theme'),root.style.colorScheme=''):(root.setAttribute('data-theme',mode),root.style.colorScheme=mode);themeToggle.checked=getCurrentTheme()!==systemTheme};setTheme('system');themeToggle.addEventListener('change',function(){this._toggling||(this._toggling=true,setTheme(getCurrentTheme()===systemTheme?(systemTheme==='dark'?'light':'dark'):'system'),this._toggling=false)});const renderMonitors=responseData=>{const monitors=responseData.data||[];if(!monitors.length){monitorCard.innerHTML='<div class="placeholder info">No monitors found</div>';return}const counts=responseData.statistics.counts,{total=0,down=0,paused=0}=counts,statusKey=down===0&&paused===0?'operational':down>0&&down<total?'someDown':down===total?'allDown':paused>0?'pausedOverall':'unknown',config=statusConfig[statusKey];overallStatus.className='overall-status';const dot=overallStatus.querySelector('.dot-lg');if(dot)dot.classList.add(config[1]);const newSpan=document.createElement('span');newSpan.id='overallText';newSpan.innerHTML=config[0].replace(/\s(\S+)$/,` <span class="${config[1]}">$1</span>`);overallText.replaceWith(newSpan);overallText=newSpan;const containerWidth=monitorCard.clientWidth,fontSize=parseFloat(getComputedStyle(root).fontSize),availableWidth=containerWidth-30*fontSize,barUnit=.3125*fontSize;let barCount=Math.min(90,Math.max(30,availableWidth/barUnit|0));const isCompact=barCount<40;root.classList.toggle('compact-mode',isCompact);const gapWidth=isCompact?(containerWidth-2.5*fontSize)/(2.5*barCount-1):0,downMonitors=[];const htmlString=monitors.reduce((html,monitor,index)=>{const config=statusConfig[monitor.statusClass||'unknown']||statusConfig.paused,ratioInfo=monitor['90dRatio']||{},id=monitor.id||monitor.monitorId;if(monitor.statusClass==='danger'&&id)downMonitors.push({id,index});const label=ratioInfo.label||'good',dailyRatios=monitor.dailyRatios||[];return html+`<div class="monitor-row" data-index="${index}"><span class="monitor-name">${monitor.name||'Unnamed'}</span><span class="monitor-uptime ${({excellent:'green',good:'green',fair:'orange',poor:'red'})[label]||''}">${ratioInfo.ratio!=null?formatPercent(ratioInfo.ratio):'—%'}</span><div class="daily-bars">${dailyRatios.slice(-barCount).map(day=>`<div class="daily-bar ${({excellent:'green',good:'lightgreen',fair:'orange',poor:'red'})[day.label]||''}" data-date="${day.date||'unknown'}" data-ratio="${formatPercent(day.ratio)}"></div>`).join('')}</div><div class="monitor-status ${config[1]}"><div class="dot dot-sm ${config[1]}"><div class="core"></div><div class="ring"></div></div><span class="status-text">${config[0]}</span></div></div>`},'');monitorCard.innerHTML=htmlString;if(isCompact){for(const container of monitorCard.querySelectorAll('.daily-bars')){container.style.display='grid';container.style.gridTemplateColumns=`repeat(${barCount},1fr)`;container.style.gap=gapWidth+'px'}}if(downMonitors.length){Promise.all(downMonitors.map(({id,index})=>fetch(`https://stats.uptimerobot.com/api/getMonitor/${MONITOR_ID}?m=${id}`).then(r=>r.ok?r.json():null).then(data=>{const code=data?.monitor?.logs?.[0]?.reason?.code;if(code){const el=monitorCard.querySelector(`.monitor-row[data-index="${index}"] .monitor-name`);if(el)el.innerHTML+=`<span class="err">${code}`}}).catch(()=>{})))}};let isLoading=false;const fetchData=async(retry=0)=>{if(isLoading)return;isLoading=true;monitorCard.innerHTML=`<div class="placeholder loading">${retry===0?'⏳ Loading...':`⏳ Loading (retry ${retry}/3)...`}</div>`;try{const response=await fetch(`https://stats.uptimerobot.com/api/getMonitorList/${MONITOR_ID}`);if(!response.ok)throw new Error(`HTTP ${response.status}`);const data=await response.json();if(data.status==='ok'&&Array.isArray(data.data)){renderMonitors(data);isLoading=false;return}throw new Error('Invalid data format')}catch(e){if(retry<3)setTimeout(()=>fetchData(retry+1),2000*(retry+1));else{monitorCard.innerHTML=`<div class="placeholder error">❌ Failed to load: ${e.message}</div>`;isLoading=false}}};fetchData(0)})();
