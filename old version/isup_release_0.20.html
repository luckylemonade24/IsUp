<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>IsUp</title><meta name="monitor-id" content="WHYtyVV51p"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%233BD771' opacity='.3'/%3E%3Ccircle cx='50' cy='50' r='25' fill='%233BD771'/%3E%3C/svg%3E"><style>*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}html::-webkit-scrollbar,body::-webkit-scrollbar{display:none}:root{color-scheme:light dark;--g:#3bd671;--lg:#9deab8;--o:#f29030;--r:#df484a;--gy:#94a3b8;--bg:light-dark(#e8ecf0,#121212);--card:light-dark(#f5f7fa,#1e1e1e);--text:light-dark(#1e293b,#e2e8f0);--muted:light-dark(#6b7280,#aaa);--border:light-dark(#dce0e6,#3d3d3d);--shadow:0 .375rem 1rem light-dark(#00000014,#0009);--ch:7.5rem;--pad:2.5rem;--bar-h:1rem;--f:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--compact-scale:.85}body{font:400 1rem/1.5 var(--f);background:var(--bg);color:var(--text);display:flex;justify-content:center;align-items:flex-start;min-height:100vh;transition:background .3s,color .3s}.container{width:100%;max-width:68.75rem;min-height:100vh;padding:var(--ch) var(--pad)0;display:flex;flex-direction:column;position:relative}.header{height:var(--ch);padding:0 var(--pad);pointer-events:none;z-index:2;display:flex;justify-content:space-between;align-items:center;position:absolute;top:0;left:0;right:0}.header h1{letter-spacing:-.03125rem;font-size:2.2rem;font-weight:700}.header h1 .text-green{color:var(--g)}.card{background:var(--card);box-shadow:var(--shadow);border-radius:.5rem;transition:background .3s,box-shadow .3s}.overall-card{height:var(--ch);display:flex;align-items:center;margin-bottom:2.75rem;padding:0 2.75rem}.overall-status{display:flex;align-items:center;gap:2.75rem;font-size:clamp(1.8rem,5vw,2.2rem);font-weight:700}.dot{flex-shrink:0;position:relative}.dot .core,.dot .ring{border-radius:50%;position:absolute;background:currentColor}.dot .ring{z-index:1;animation:2s ease-out infinite pulse}.dot.gray .ring{opacity:0;animation:none}@keyframes pulse{0%{opacity:.8;transform:scale(1)}to{opacity:0;transform:scale(2)}}.dot-lg{width:2rem;height:2rem;transform:translateY(.125rem)}.dot-lg .core,.dot-lg .ring{width:1.5rem;height:1.5rem;top:.25rem;left:.25rem}.dot-sm{width:1rem;height:1rem}.dot-sm .core,.dot-sm .ring{width:.75rem;height:.75rem;top:.125rem;left:.125rem}.services-title{margin-bottom:.75rem;padding-left:.125rem;font-size:2.2rem;font-weight:700}.monitor-row{display:flex;flex-wrap:wrap;align-items:center;min-height:4.5rem;padding:.3rem 1.25rem;transition:background .2s;position:relative}.monitor-row:not(:last-child):after{content:"";background:var(--border);height:.0625rem;position:absolute;bottom:0;left:1.25rem;right:1.25rem}.monitor-row .monitor-name{white-space:nowrap;text-overflow:ellipsis;flex:1;min-width:8rem;font-size:1.05rem;overflow:hidden}.monitor-uptime{text-align:right;flex:0 0 5rem;margin-right:1.25rem;font-size:1.05rem}.monitor-row .daily-bars{z-index:2;flex:none;display:flex;align-items:center;gap:.125rem;margin-right:1.25rem;position:relative}.daily-bar{height:var(--bar-h);cursor:default;background:currentColor;color:var(--gy);border-radius:99px;flex:0 0 .1875rem;position:relative;transition:transform .2s}.daily-bar:hover{transform:scaleY(1.2)}.daily-bar:hover:after{content:attr(data-date)": "attr(data-ratio);background:var(--card);color:var(--text);white-space:nowrap;box-shadow:var(--shadow);border:1px solid var(--border);z-index:1;pointer-events:none;border-radius:.4rem;padding:.3rem .7rem;font-size:.7rem;font-weight:500;position:absolute;bottom:calc(100% + 8px);left:50%;transform:translate(-50%)}.monitor-row .monitor-status{z-index:1;flex:0 0 5rem;display:flex;align-items:center;gap:.375rem;font-size:1.05rem;position:relative}.placeholder{text-align:center;padding:3.75rem 1.25rem;font-size:.95rem}.placeholder.loading{color:var(--gy)}.placeholder.error{color:var(--r)}.footer{color:var(--muted);display:flex;justify-content:space-between;align-items:baseline;margin-top:auto;padding:1.5rem 0 1.25rem;font-size:.95rem;line-height:1.5}.footer-left{display:flex;align-items:baseline}.footer a{color:var(--muted);text-decoration:none;transition:color .2s}.footer a:hover{color:var(--text)}.footer .dot-green{background:var(--g);border-radius:50%;align-self:center;width:.5rem;height:.5rem;margin:0 .125rem;display:inline-block}.footer .uptime-robot{color:var(--text);font-size:1.3rem;font-weight:700}.footer .uptime-robot a{color:var(--text)}.footer .uptime-robot a:hover{text-decoration:underline}.footer-right{display:flex;align-items:center;gap:.2rem}.err{color:#e2e8f0;background:var(--r);border-radius:.2rem;margin-left:.3rem;padding:.05rem .4rem;font-size:.7rem;font-weight:700;display:inline-block}.green{color:var(--g)}.lightgreen{color:var(--lg)}.orange{color:var(--o)}.red{color:var(--r)}.gray{color:var(--gy)}@media(max-width:680px){html{font-size:calc(16px*var(--compact-scale))}.monitor-row .monitor-uptime{margin-right:.5rem}.monitor-row .daily-bars{order:2;width:100%;margin-right:0}.monitor-row .daily-bar{aspect-ratio:3/7;height:auto}}</style></head><body><div class="container"><div class="header"><h1>Is<span class="text-green">Up</span></h1></div><div class="overall-card card"><div class="overall-status green"><div class="dot dot-lg"><div class="core"></div><div class="ring"></div></div><span id="overallText">All systems <span class="green">Operational</span></span></div></div><div class="services-title">Services</div><div class="card" id="monitorCard"><div class="placeholder loading">⏳ Loading...</div></div><div class="footer"><div class="footer-left"><a href="https://github.com/luckylemonade24/IsUp" target="_blank" rel="noopener">v0.20</a></div><div class="footer-right"><span>data from</span><span class="dot-green"></span><span class="uptime-robot"><a href="https://uptimerobot.com/" target="_blank" rel="noopener">UptimeRobot</a></span></div></div></div><script>(()=>{const root=document.documentElement,monitorCard=document.getElementById('monitorCard'),MONITOR_ID=document.querySelector('meta[name="monitor-id"]').content;let overallText=document.getElementById('overallText');const overallStatus=document.querySelector('.overall-status'),statusConfig={success:['Up','green'],danger:['Down','red'],notchecked:['None','gray'],paused:['Paused','gray'],operational:['All systems Operational','green'],someDown:['Some systems down','orange'],allDown:['All systems down','red'],pausedOverall:['Some systems paused','gray'],unknown:['Unknown status','gray']};const renderMonitors=responseData=>{const monitors=responseData.data||[];if(!monitors.length){monitorCard.innerHTML='<div class="placeholder info">No monitors found</div>';return}const counts=responseData.statistics.counts,{total=0,down=0,paused=0}=counts,statusKey=down===0&&paused===0?'operational':down>0&&down<total?'someDown':down===total?'allDown':paused>0?'pausedOverall':'unknown',config=statusConfig[statusKey];overallStatus.className='overall-status';const dot=overallStatus.querySelector('.dot-lg');if(dot)dot.classList.add(config[1]);const newSpan=document.createElement('span');newSpan.id='overallText';newSpan.innerHTML=config[0].replace(/\s(\S+)$/,` <span class="${config[1]}">$1</span>`);overallText.replaceWith(newSpan);overallText=newSpan;const containerWidth=monitorCard.clientWidth,fontSize=parseFloat(getComputedStyle(root).fontSize),availableWidth=containerWidth-30*fontSize,barUnit=.3125*fontSize;let barCount=Math.min(90,Math.max(30,availableWidth/barUnit|0));const isCompact=barCount<40;const gapWidth=isCompact?(containerWidth-2.5*fontSize)/(2.5*barCount-1):0,downMonitors=[];const htmlString=monitors.reduce((html,monitor,index)=>{const config=statusConfig[monitor.statusClass||'unknown']||statusConfig.paused,ratioInfo=monitor['90dRatio']||{},id=monitor.id||monitor.monitorId;if(monitor.statusClass==='danger'&&id)downMonitors.push({id,index});const label=ratioInfo.label||'good',dailyRatios=monitor.dailyRatios||[];return html+`<div class="monitor-row" data-index="${index}"><span class="monitor-name">${monitor.name||'Unnamed'}</span><span class="monitor-uptime ${({excellent:'green',good:'green',fair:'orange',poor:'red'})[label]||''}">${ratioInfo.ratio+'%'}</span><div class="daily-bars">${dailyRatios.slice(-barCount).map(day=>`<div class="daily-bar ${({excellent:'green',good:'lightgreen',fair:'orange',poor:'red'})[day.label]||''}" data-date="${day.date||'unknown'}" data-ratio="${day.ratio+'%'}"></div>`).join('')}</div><div class="monitor-status ${config[1]}"><div class="dot dot-sm ${config[1]}"><div class="core"></div><div class="ring"></div></div><span class="status-text">${config[0]}</span></div></div>`},'');monitorCard.innerHTML=htmlString;if(isCompact){for(const container of monitorCard.querySelectorAll('.daily-bars')){container.style.display='grid';container.style.gridTemplateColumns=`repeat(${barCount},1fr)`;container.style.gap=gapWidth+'px'}}if(downMonitors.length){Promise.all(downMonitors.map(({id,index})=>fetch(`https://stats.uptimerobot.com/api/getMonitor/${MONITOR_ID}?m=${id}`).then(r=>r.ok?r.json():null).then(data=>{const code=data?.monitor?.logs?.[0]?.reason?.code;if(code){const el=monitorCard.querySelector(`.monitor-row[data-index="${index}"] .monitor-name`);if(el)el.innerHTML+=`<span class="err">${code}</span>`}}).catch(()=>{})))}};let isLoading=false;const fetchData=async()=>{if(isLoading)return;isLoading=true;monitorCard.innerHTML='<div class="placeholder loading">⏳ Loading...</div>';try{const response=await fetch(`https://stats.uptimerobot.com/api/getMonitorList/${MONITOR_ID}`);if(!response.ok)throw new Error(`HTTP ${response.status}`);const data=await response.json();if(data.status==='ok'&&Array.isArray(data.data)){renderMonitors(data);isLoading=false;return}throw new Error('Invalid data format')}catch(e){monitorCard.innerHTML=`<div class="placeholder error">❌ Failed to load: ${e.message}</div>`;isLoading=false}};fetchData()})();</script></body></html>
