<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Status Page</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%233BD771' opacity='0.3'/%3E%3Ccircle cx='50' cy='50' r='25' fill='%233BD771'/%3E%3C/svg%3E" type="image/svg+xml">
  <style>
    :root {
      --green: #3BD671;
      --light-green: #9DEAB8;
      --orange: #F29030;
      --red: #DF484A;
      --gray: #94a3b8;
      --bg: #f0f2f5;
      --text: #1e293b;
      --white: #ffffff;
      --black-bg: #1a1a1a;
      --row-height: 64px;
      --card-height: 120px;
      --container-padding: 40px;
      --shadow-card: 0 6px 16px rgba(0, 0, 0, 0.10);
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { height:100%; scrollbar-width:none; -ms-overflow-style:none; }
    html::-webkit-scrollbar, body::-webkit-scrollbar { display:none; }
    body {
      font-family:var(--font-family);
      background:var(--bg);
      color:var(--text);
      display:flex;
      justify-content:center;
      align-items:flex-start;
      min-height:100vh;
      padding:0;
      position:relative;
    }

    .black-bg {
      position:absolute; top:0; left:0; right:0; height:26vh;
      background:var(--black-bg); z-index:0;
    }

    .container {
      max-width:1100px; width:100%; min-height:100vh;
      display:flex; flex-direction:column;
      padding:var(--card-height) var(--container-padding) 0;
      position:relative; z-index:1; background:transparent;
    }

    .header {
      position:absolute; top:0; left:0; right:0; height:var(--card-height);
      display:flex; justify-content:space-between; align-items:center;
      padding:0 var(--container-padding); pointer-events:none; z-index:2;
    }
    .header > * { pointer-events:auto; }
    .header-left h1 {
      font-size:2.2rem; font-weight:700; color:white; letter-spacing:-0.5px;
    }
    .header-right { text-align:right; line-height:1.5; }
    .header-right .service-status {
      font-size:1.3rem; font-weight:700; color:white;
    }
    .header-right .update-info {
      font-size:0.95rem; color:#999;
    }
    .header-right .update-info span { font-weight:500; color:#aaa; }

    .overall-card,
    .monitor-card {
      background:var(--white);
      border-radius:8px;
      box-shadow:var(--shadow-card);
      overflow:hidden;
    }
    .overall-card {
      margin-bottom:44px;
      height:var(--card-height); min-height:var(--card-height);
      display:flex; align-items:center; padding:0 44px;
    }
    .overall-status {
      display:flex; align-items:center; gap:44px;
      font-size:2.2rem; font-weight:700; color:#0f172a;
    }
    /* 总体状态圆点 */
    .overall-status .pulsing-dot {
      position:relative; width:32px; height:32px; flex-shrink:0;
      transform:translateY(2px);
    }
    .overall-status .pulsing-dot .core {
      width:24px; height:24px; border-radius:50%;
      position:absolute; top:4px; left:4px; z-index:2;
      background:var(--green);
    }
    /* 扩散圆：大小与 core 相同，缩放至 2 倍（即半径变为原来的 2 倍） */
    .overall-status .pulsing-dot .ring {
      position:absolute; top:4px; left:4px;
      width:24px; height:24px; border-radius:50%;
      background:var(--green);
      opacity:0.8;
      animation:pulse-ring 2s ease-out infinite;
      z-index:1;
      transform-origin:center center;
    }
    @keyframes pulse-ring {
      0% { transform:scale(1); opacity:0.8; }
      100% { transform:scale(2); opacity:0; }
    }

    .services-title {
      font-size:2.2rem; font-weight:700; color:#0f172a;
      margin-bottom:12px; padding-left:2px;
    }

    .monitor-row {
      display:flex; align-items:center;
      padding:0 20px; position:relative;
      height:var(--row-height);
    }
    .monitor-row::after {
      content:''; position:absolute; left:20px; right:20px; bottom:0;
      height:1px; background:#e9edf2;
    }
    .monitor-row:last-child::after { display:none; }
    .monitor-row:hover { background:#f8fafc; }

    .monitor-name {
      font-weight:400; font-size:1.05rem; color:#0f172a;
      flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
      min-width:100px;
    }
    .monitor-uptime {
      font-weight:400; font-size:1.05rem;
      flex:0 0 80px; text-align:right; margin-right:20px;
    }
    .monitor-uptime.excellent,
    .monitor-uptime.good { color:var(--green); }
    .monitor-uptime.fair { color:var(--orange); }
    .monitor-uptime.poor { color:var(--red); }

    .daily-bars {
      flex:0 0 auto; display:flex; align-items:center;
      gap:2px; justify-content:flex-end; margin-right:20px;
    }
    .daily-bar {
      width:3px; height:16px; flex-shrink:0; flex-grow:0;
      border-radius:8px; background:#e2e8f0;
      transition:transform .1s; cursor:default;
    }
    .daily-bar:hover { transform:scaleY(1.2); }
    .daily-bar.excellent { background:var(--green); }
    .daily-bar.good { background:var(--light-green); }
    .daily-bar.fair { background:var(--orange); }
    .daily-bar.poor { background:var(--red); }

    /* 列表状态圆点 */
    .monitor-status {
      flex:0 0 80px; display:flex; align-items:center; gap:6px;
      font-size:1.05rem; font-weight:400;
    }
    .monitor-status .pulsing-dot {
      position:relative; width:16px; height:16px; flex-shrink:0;
    }
    .monitor-status .pulsing-dot .core {
      width:12px; height:12px; border-radius:50%;
      position:absolute; top:2px; left:2px; z-index:2;
      background:var(--green);
    }
    .monitor-status .pulsing-dot .ring {
      position:absolute; top:2px; left:2px;
      width:12px; height:12px; border-radius:50%;
      background:var(--green);
      opacity:0.6;
      animation:pulse-ring-small 1.8s ease-out infinite;
      z-index:1;
      transform-origin:center center;
    }
    @keyframes pulse-ring-small {
      0% { transform:scale(1); opacity:0.6; }
      100% { transform:scale(2); opacity:0; }
    }
    /* 状态文字颜色由类控制，但背景色已在类中定义（见下方） */
    .monitor-status .pulsing-dot .core.Up { background:var(--green); }
    .monitor-status .pulsing-dot .core.Down { background:var(--red); }
    .monitor-status .pulsing-dot .core.Paused { background:var(--gray); }
    .monitor-status .pulsing-dot .ring.Up { background:var(--green); }
    .monitor-status .pulsing-dot .ring.Down { background:var(--red); }
    .monitor-status .pulsing-dot .ring.Paused { background:var(--gray); }

    .monitor-status .status-text.Up { color:var(--green); }
    .monitor-status .status-text.Down { color:var(--red); }
    .monitor-status .status-text.Paused { color:var(--gray); }

    .loading-placeholder,
    .error-placeholder {
      padding:60px 20px; text-align:center;
      color:#94a3b8; font-size:.95rem;
    }
    .error-placeholder { color:#dc2626; }

    .footer {
      margin-top:auto; padding:24px 0 20px;
      text-align:right; font-size:.95rem;
      display:flex; justify-content:flex-end; align-items:center;
      gap:4px; background:transparent;
    }
    .footer .by { color:#999; font-weight:400; }
    .footer .dot-green {
      display:inline-block; width:.5rem; height:.5rem;
      background:var(--green); border-radius:50%;
      margin:0 2px; vertical-align:middle; margin-top:4px;
    }
    .footer .uptime-robot {
      font-weight:700; color:#0f172a; font-size:1.3rem;
    }

    @media (max-width:820px) {
      .container { padding-left:40px; padding-right:40px; }
      .header { padding:0 40px; }
      .monitor-uptime { margin-right:14px; }
      .daily-bars { margin-right:14px; gap:1.5px; }
      .daily-bar { height:14px; border-radius:7px; }
      .monitor-row {
        flex-wrap:wrap; gap:4px 8px; padding:0 16px;
        height:auto; min-height:var(--row-height);
      }
      .monitor-name { flex:1 1 100px; }
      .monitor-uptime { flex:0 0 60px; }
      .daily-bars { flex:0 0 auto; order:3; margin-right:0; margin-top:4px; }
      .monitor-status { flex:0 0 auto; order:2; gap:10px; }
      .overall-card { padding:0 24px; }
      .overall-status { font-size:1.6rem; gap:28px; }
      .overall-status .pulsing-dot { width:26px; height:26px; }
      .overall-status .pulsing-dot .core,
      .overall-status .pulsing-dot .ring { width:20px; height:20px; top:3px; left:3px; }
      .header-left h1,
      .services-title { font-size:1.6rem; }
      .header-right .service-status { font-size:1.1rem; }
      .header-right .update-info { font-size:.8rem; }
      :root { --row-height:64px; --card-height:120px; }
    }

    @media (max-width:480px) {
      .container { padding-left:16px; padding-right:16px; }
      .header { padding:0 16px; }
      .monitor-uptime { margin-right:10px; }
      .daily-bars { margin-right:10px; gap:1px; }
      .daily-bar { height:12px; border-radius:6px; width:2.5px; }
      .header-left h1,
      .services-title { font-size:1.3rem; }
      .header-right .service-status { font-size:1rem; }
      .header-right .update-info { font-size:.7rem; }
      .overall-status { font-size:1.3rem; gap:20px; }
      .overall-status .pulsing-dot { width:22px; height:22px; }
      .overall-status .pulsing-dot .core,
      .overall-status .pulsing-dot .ring { width:16px; height:16px; top:3px; left:3px; }
      .monitor-name { flex:1 1 70px; font-size:.9rem; }
      .monitor-uptime { flex:0 0 50px; font-size:.9rem; }
      .monitor-status { font-size:.9rem; gap:8px; flex:0 0 60px; }
      .monitor-status .pulsing-dot { width:14px; height:14px; }
      .monitor-status .pulsing-dot .core,
      .monitor-status .pulsing-dot .ring { width:10px; height:10px; top:2px; left:2px; }
      .footer .by,
      .footer .uptime-robot { font-size:.8rem; }
      .footer .uptime-robot { font-size:1rem; }
      .footer .dot-green { width:.4rem; height:.4rem; margin-top:3px; }
      .footer { padding:20px 0 16px; }
      :root { --row-height:56px; --card-height:100px; }
    }

    .monitor-row { height:var(--row-height); }
    .overall-card { height:var(--card-height); min-height:var(--card-height); }
    .container { padding-top:var(--card-height); }
    .header { height:var(--card-height); }
  </style>
</head>
<body>

  <div class="black-bg"></div>

  <div class="container" id="app">

    <div class="header">
      <div class="header-left"><h1>Status page</h1></div>
      <div class="header-right">
        <div class="service-status">Service status</div>
        <div class="update-info">
          Last updated <span id="lastUpdated">--</span> &nbsp;|&nbsp; Next update in <span id="countdown">--</span> sec.
        </div>
      </div>
    </div>

    <div class="overall-card" id="overallCard">
      <div class="overall-status" id="overallStatus">
        <div class="pulsing-dot" id="overallDot">
          <div class="core" id="overallCore" style="background:#3BD671;"></div>
          <div class="ring" id="overallRing" style="background:#3BD671;"></div>
        </div>
        <span id="overallText">All systems Operational</span>
      </div>
    </div>

    <div class="services-title">Services</div>

    <div class="monitor-card" id="monitorCard">
      <div class="loading-placeholder">⏳ Loading monitor data...</div>
    </div>

    <div class="footer">
      <span class="by">Status page by</span>
      <span class="dot-green"></span>
      <span class="uptime-robot">UptimeRobot</span>
    </div>

  </div>

  <script>
    (function() {
      const API_URL = 'https://stats.uptimerobot.com/api/getMonitorList/WHYtyVV51p';
      const REFRESH_INTERVAL = 5 * 60;
      let countdown = REFRESH_INTERVAL;
      let countdownInterval = null;
      let lastUpdateTime = null;

      const COLORS = {
        green: '#3BD671',
        lightGreen: '#9DEAB8',
        orange: '#F29030',
        red: '#DF484A'
      };

      function getBarClass(label) {
        const map = { 'excellent': 'excellent', 'good': 'good', 'fair': 'fair', 'poor': 'poor' };
        return map[label] || '';
      }

      function getUptimeClass(label) {
        const map = { 'excellent': 'excellent', 'good': 'good', 'fair': 'fair', 'poor': 'poor' };
        return map[label] || '';
      }

      function getStatusDotClass(status) {
        if (status === 'success') return 'Up';
        if (status === 'danger') return 'Down';
        return 'Paused';
      }

      function getStatusText(status) {
        if (status === 'success') return 'Up';
        if (status === 'danger') return 'Down';
        return 'Paused';
      }

      function formatRatioRaw(str) {
        if (str === undefined || str === null || str === '') return '—%';
        if (str.includes('%')) return str;
        return str + '%';
      }

      function get90dRatio(item) {
        const r = item['90dRatio'] || {};
        return {
          ratio: r.ratio !== undefined ? formatRatioRaw(r.ratio) : '—%',
          label: r.label || 'good'
        };
      }

      function updateCountdownDisplay() {
        const el = document.getElementById('countdown');
        if (el) el.textContent = countdown;
      }

      function startCountdown() {
        if (countdownInterval) clearInterval(countdownInterval);
        countdown = REFRESH_INTERVAL;
        updateCountdownDisplay();
        countdownInterval = setInterval(() => {
          countdown -= 1;
          if (countdown <= 0) {
            countdown = REFRESH_INTERVAL;
            loadData(true);
          }
          updateCountdownDisplay();
        }, 1000);
      }

      function setLastUpdated() {
        if (lastUpdateTime) {
          const timeStr = lastUpdateTime.toLocaleTimeString('en-GB', {
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit'
          });
          document.getElementById('lastUpdated').textContent = timeStr;
        }
      }

      function updateOverallStatus(counts) {
        const total = counts.total || 0;
        const up = counts.up || 0;
        const down = counts.down || 0;
        const paused = counts.paused || 0;

        const core = document.getElementById('overallCore');
        const ring = document.getElementById('overallRing');
        const textSpan = document.getElementById('overallText');

        let statusText = '';
        let color = COLORS.green;

        if (down === 0 && paused === 0) {
          statusText = 'All systems Operational';
          color = COLORS.green;
        } else if (down > 0 && down < total) {
          statusText = 'Some systems down';
          color = COLORS.orange;
        } else if (down === total) {
          statusText = 'All systems down';
          color = COLORS.red;
        } else if (paused > 0) {
          statusText = 'Some systems paused';
          color = '#94a3b8';
        } else {
          statusText = 'Unknown status';
          color = '#94a3b8';
        }

        textSpan.textContent = statusText;
        core.style.background = color;
        ring.style.background = color;
      }

      function render(data) {
        const card = document.getElementById('monitorCard');
        const monitors = data.data || [];

        if (data.statistics && data.statistics.counts) {
          updateOverallStatus(data.statistics.counts);
        } else if (data.psp && data.psp.monitors) {
          const items = data.psp.monitors || [];
          const up = items.filter(m => m.statusClass === 'success').length;
          const down = items.filter(m => m.statusClass === 'danger').length;
          const paused = items.filter(m => m.statusClass !== 'success' && m.statusClass !== 'danger').length;
          updateOverallStatus({ up, down, paused, total: items.length });
        }

        if (monitors.length === 0) {
          card.innerHTML = '<div class="loading-placeholder">No monitors found</div>';
          return;
        }

        let html = '';
        for (const item of monitors) {
          const name = item.name || 'Unnamed';
          const statusClass = item.statusClass || 'unknown';
          const dotClass = getStatusDotClass(statusClass);
          const statusText = getStatusText(statusClass);

          const uptimeInfo = get90dRatio(item);
          const uptimeClass = getUptimeClass(uptimeInfo.label);
          const uptimeDisplay = uptimeInfo.ratio;

          const daily = Array.isArray(item.dailyRatios) ? item.dailyRatios : [];
          const recent = daily.slice(-90);

          let barsHtml = '';
          for (const day of recent) {
            const barClass = getBarClass(day.label);
            const ratioStr = day.ratio !== undefined && day.ratio !== null ?
              formatRatioRaw(day.ratio) :
              '?%';
            const dateStr = day.date || 'unknown';
            barsHtml += `<div class="daily-bar ${barClass}" title="${dateStr}: ${ratioStr}"></div>`;
          }
          if (recent.length < 90) {
            const need = 90 - recent.length;
            for (let i = 0; i < need; i++) {
              barsHtml += `<div class="daily-bar" title="No data"></div>`;
            }
          }

          html += `
              <div class="monitor-row">
                <span class="monitor-name" title="${name}">${name}</span>
                <span class="monitor-uptime ${uptimeClass}">${uptimeDisplay}</span>
                <div class="daily-bars">${barsHtml}</div>
                <div class="monitor-status">
                  <div class="pulsing-dot">
                    <div class="core ${dotClass}"></div>
                    <div class="ring ${dotClass}"></div>
                  </div>
                  <span class="status-text ${dotClass}">${statusText}</span>
                </div>
              </div>
            `;
        }
        card.innerHTML = html;

        lastUpdateTime = new Date();
        setLastUpdated();
        countdown = REFRESH_INTERVAL;
        updateCountdownDisplay();
      }

      async function loadData(silent = false) {
        const card = document.getElementById('monitorCard');
        if (!silent) {
          card.innerHTML = '<div class="loading-placeholder">⏳ Loading...</div>';
        }
        try {
          const resp = await fetch(API_URL);
          if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
          const json = await resp.json();
          if (json.status === 'ok' && Array.isArray(json.data)) {
            render(json);
          } else {
            throw new Error('Invalid data format');
          }
        } catch (err) {
          if (!silent) {
            card.innerHTML =
            `<div class="error-placeholder">❌ Failed to load: ${err.message}</div>`;
          } else {
            console.warn('Silent refresh failed:', err.message);
          }
        }
      }

      loadData(false);
      startCountdown();
      setInterval(() => {
        if (lastUpdateTime) setLastUpdated();
      }, 10000);
    })();
  </script>

</body>
</html>
