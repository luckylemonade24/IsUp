<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IsUp</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%233BD771' opacity='.3'/%3E%3Ccircle cx='50' cy='50' r='25' fill='%233BD771'/%3E%3C/svg%3E">
  <style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;scrollbar-width:none;-ms-overflow-style:none}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none}
:root{color-scheme:light dark;--g:#3BD671;--lg:#9DEAB8;--o:#F29030;--r:#DF484A;--gy:#94a3b8;--bg:light-dark(#e8ecf0,#121212);--card:light-dark(#f5f7fa,#1e1e1e);--text:light-dark(#1e293b,#e2e8f0);--muted:light-dark(#6b7280,#aaa);--border:light-dark(#dce0e6,#3d3d3d);--shadow:0 .375rem 1rem light-dark(rgba(0,0,0,.08),rgba(0,0,0,.6));--ch:7.5rem;--pad:2.5rem;--bar-h:1rem;--f:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--compact-scale:.85}
html.compact-mode{font-size:calc(16px*var(--compact-scale))}
body{font:400 1rem/1.5 var(--f);background:var(--bg);color:var(--text);display:flex;justify-content:center;align-items:flex-start;min-height:100vh;transition:background .3s,color .3s}
.container{max-width:68.75rem;width:100%;min-height:100vh;display:flex;flex-direction:column;padding:var(--ch) var(--pad) 0;position:relative}
.header{position:absolute;top:0;left:0;right:0;height:var(--ch);display:flex;justify-content:space-between;align-items:center;padding:0 var(--pad);pointer-events:none;z-index:2;background:var(--bg);transition:background .3s}
.header>*{pointer-events:auto}
.header h1{font-size:2.2rem;font-weight:700;letter-spacing:-.03125rem}.header h1 .text-green{color:var(--g)}
.header-right{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:.2rem}
.theme-toggle{display:inline-flex;align-items:center;cursor:pointer;user-select:none}
.theme-toggle input{position:absolute;opacity:0;pointer-events:none}
.theme-toggle svg{width:1.375rem;height:1.375rem;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.theme-toggle .sun{display:block}.theme-toggle .moon{display:none}
:root[data-theme="light"] .theme-toggle .sun{display:block}:root[data-theme="light"] .theme-toggle .moon{display:none}
:root[data-theme="dark"] .theme-toggle .sun{display:none}:root[data-theme="dark"] .theme-toggle .moon{display:block}
@media(prefers-color-scheme:light){:root:not([data-theme]) .theme-toggle .sun{display:block}:root:not([data-theme]) .theme-toggle .moon{display:none}}
@media(prefers-color-scheme:dark){:root:not([data-theme]) .theme-toggle .sun{display:none}:root:not([data-theme]) .theme-toggle .moon{display:block}}
.card{background:var(--card);border-radius:.5rem;box-shadow:var(--shadow);transition:background .3s,box-shadow .3s}
.overall-card{margin-bottom:2.75rem;height:var(--ch);display:flex;align-items:center;padding:0 2.75rem}
.overall-status{display:flex;align-items:center;gap:2.75rem;font-size:2.2rem;font-weight:700}
.dot{position:relative;flex-shrink:0}
.dot .core,.dot .ring{border-radius:50%;position:absolute;background:var(--g);transition:background .3s}
.dot .ring{animation:pulse var(--pulse-duration,2s) ease-out infinite;z-index:1;transform-origin:center}
.dot.gray .ring{animation:none;opacity:0}.dot.gray .core{background:var(--gy)}
.dot.status-green .core,.dot.status-green .ring{background:#3BD671}
.dot.status-orange .core,.dot.status-orange .ring{background:#F29030}
.dot.status-red .core,.dot.status-red .ring{background:#DF484A}
.dot.status-gray .core,.dot.status-gray .ring{background:#94a3b8}

.dot-lg{width:2rem;height:2rem;transform:translateY(.125rem)}
.dot-lg .core,.dot-lg .ring{width:1.5rem;height:1.5rem;top:.25rem;left:.25rem;--pulse-start:.8;--pulse-duration:2s}
.dot-sm{width:1rem;height:1rem}
.dot-sm .core,.dot-sm .ring{width:.75rem;height:.75rem;top:.125rem;left:.125rem;--pulse-start:.6;--pulse-duration:1.8s}
.services-title{font-size:2.2rem;font-weight:700;margin-bottom:.75rem;padding-left:.125rem}
.monitor-row{display:flex;align-items:center;padding:0 1.25rem;position:relative;min-height:4rem;transition:background .2s;content-visibility:auto;contain-intrinsic-size:auto 4rem;contain:layout style;flex-wrap:nowrap}
.monitor-row::after{content:'';position:absolute;left:1.25rem;right:1.25rem;bottom:0;height:.0625rem;background:var(--border)}
.monitor-row:last-child::after{display:none}
.monitor-row .monitor-name{font-size:1.05rem;flex:1;min-width:15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.monitor-row .monitor-uptime{font-size:1.05rem;flex:0 0 5rem;text-align:right;margin-right:1.25rem}
.monitor-row .monitor-uptime.excellent,.monitor-row .monitor-uptime.good{color:var(--g)}
.monitor-row .monitor-uptime.fair{color:var(--o)}
.monitor-row .monitor-uptime.poor{color:var(--r)}
.monitor-row .daily-bars{flex:0 0 auto;display:flex;align-items:center;gap:.125rem;margin-right:1.25rem;contain:layout style}
.monitor-row .daily-bar{flex:0 0 .1875rem;height:var(--bar-h);border-radius:.5rem;background:#e2e8f0;transition:transform .1s;cursor:default}
.monitor-row .daily-bar:hover{transform:scaleY(1.2)}
.monitor-row .daily-bar.excellent{background:var(--g)}
.monitor-row .daily-bar.good{background:var(--lg)}
.monitor-row .daily-bar.fair{background:var(--o)}
.monitor-row .daily-bar.poor{background:var(--r)}
.monitor-row .monitor-status{flex:0 0 5rem;display:flex;align-items:center;gap:.375rem;font-size:1.05rem}
.monitor-row .monitor-status .status-text.Up{color:var(--g)}
.monitor-row .monitor-status .status-text.Down{color:var(--r)}
.monitor-row .monitor-status .status-text.Paused,.monitor-row .monitor-status .status-text.None{color:var(--gy)}
.compact-mode .monitor-row{flex-wrap:wrap;min-height:4.5rem;padding:.3rem 1.25rem}
.compact-mode .monitor-row .monitor-name{flex:1 0 auto;min-width:8rem}
.compact-mode .monitor-row .monitor-uptime{flex:0 0 auto;margin-right:.5rem}
.compact-mode .monitor-row .monitor-status{flex:0 0 auto}
.compact-mode .monitor-row .daily-bars{flex:1 1 100%;order:2;margin-top:.2rem;margin-right:0;width:100%;display:grid}
.compact-mode .monitor-row .daily-bar{height:auto;aspect-ratio:3/7;border-radius:.3rem;min-width:2px}
.placeholder{padding:3.75rem 1.25rem;text-align:center;font-size:.95rem}
.placeholder.loading{color:var(--gy)}.placeholder.error{color:#dc2626}
.footer{margin-top:auto;padding:1.5rem 0 1.25rem;font-size:.95rem;display:flex;justify-content:space-between;align-items:center;color:var(--muted)}
.footer a{color:var(--muted);text-decoration:none;transition:color .2s}.footer a:hover{color:var(--text)}
.footer .dot-green{display:inline-block;width:.5rem;height:.5rem;background:var(--g);border-radius:50%;margin:0 .125rem;vertical-align:middle}
.footer .uptime-robot{font-weight:700;color:var(--text);font-size:1.3rem}.footer .uptime-robot a{color:var(--text)}.footer .uptime-robot a:hover{text-decoration:underline}
.text-green{color:#3BD671}.text-orange{color:#F29030}.text-red{color:#DF484A}.text-gray{color:#94a3b8}
.err{display:inline-block;background:#DF484A;color:#fff;font-weight:700;font-size:.7rem;padding:.05rem .4rem;border-radius:.2rem;margin-left:.3rem;vertical-align:middle}
</style>
