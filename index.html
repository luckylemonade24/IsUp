<body><div class="container"><div class="header"><h1>Is<span class="text-green">Up</span></h1><div class="header-right"><label class="theme-toggle" aria-label="切换明暗主题"><input type="checkbox" id="themeToggle"><svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg><svg class="moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></label></div></div><div class="overall-card card"><div class="overall-status"><div class="dot dot-lg" id="overallDot" data-status="green"><div class="core"></div><div class="ring"></div></div><span id="overallText">All systems <span class="text-green">Operational</span></span></div></div><div class="services-title">Services</div><div class="card" id="monitorCard"><div class="placeholder loading">⏳ Loading...</div></div><div class="footer"><div class="footer-left"><a href="https://github.com/luckylemonade24/IsUp" target="_blank" rel="noopener">v0.16</a></div><div class="footer-right"><span>data from</span><span class="dot-green"></span><span class="uptime-robot"><a href="https://uptimerobot.com/" target="_blank" rel="noopener">UptimeRobot</a></span></div></div></div><script>
(()=>{const root=document.documentElement,darkMedia=window.matchMedia("(prefers-color-scheme: dark)"),systemTheme=darkMedia.matches?"dark":"light",getElementById=id=>document.getElementById(id),themeToggle=getElementById("themeToggle"),monitorCard=getElementById("monitorCard"),overallDot=getElementById("overallDot");let overallText=getElementById("overallText");const statusConfig={success:{text:"Up",status:"green"},danger:{text:"Down",status:"red"},notchecked:{text:"None",status:"gray"},paused:{text:"Paused",status:"gray"},operational:{text:"All systems Operational",status:"green"},someDown:{text:"Some systems down",status:"orange"},allDown:{text:"All systems down",status:"red"},pausedOverall:{text:"Some systems paused",status:"gray"},unknown:{text:"Unknown status",status:"gray"}},formatPercent=value=>value==null||value===""?"—%":value+(value.includes("%")?"":"%"),getCurrentTheme=()=>root.getAttribute("data-theme")||systemTheme,setTheme=mode=>{mode==="system"?(root.removeAttribute("data-theme"),root.style.colorScheme=""):(root.setAttribute("data-theme",mode),root.style.colorScheme=mode);themeToggle.checked=getCurrentTheme()!==systemTheme};setTheme("system");themeToggle.addEventListener("change",function(){if(this._toggling)return;this._toggling=true;const currentTheme=getCurrentTheme();setTheme(currentTheme===systemTheme?(systemTheme==="dark"?"light":"dark"):"system");this._toggling=false});const updateOverallStatus=counts=>{const total=counts.total||0,down=counts.down||0,paused=counts.paused||0,statusKey=down===0&&paused===0?"operational":down>0&&down<total?"someDown":down===total?"allDown":paused>0?"pausedOverall":"unknown",config=statusConfig[statusKey],newSpan=document.createElement("span");newSpan.id="overallText";newSpan.innerHTML=config.text.replace(/\s(\S+)$/,' <span class="text-'+config.status+'">$1</span>');overallText.parentNode.replaceChild(newSpan,overallText);overallText=newSpan;overallDot.dataset.status=config.status};const showPlaceholder=(type,text)=>{monitorCard.innerHTML='<div class="placeholder '+type+'">'+text+'</div>'};const renderMonitors=responseData=>{const monitors=responseData.data||[];if(responseData.statistics?.counts)updateOverallStatus(responseData.statistics.counts);else if(responseData.psp?.monitors){const list=responseData.psp.monitors,counts=list.reduce((acc,monitor)=>{if(monitor.statusClass==="danger")acc.down++;if(monitor.statusClass==="paused"||monitor.statusClass==="notchecked")acc.paused++;return acc},{down:0,paused:0});updateOverallStatus({total:list.length,...counts})}if(monitors.length===0){showPlaceholder("info","No monitors found");return}const containerWidth=monitorCard.clientWidth,fontSize=parseFloat(getComputedStyle(root).fontSize),availableWidth=containerWidth-30*fontSize,barUnit=.3125*fontSize;let barCount=Math.min(90,Math.max(30,Math.floor(availableWidth/barUnit)));const isCompact=barCount<40;root.classList.toggle("compact-mode",isCompact);const gapWidth=isCompact?(containerWidth-2.5*fontSize)/(2.5*barCount-1):0,downMonitors=[];const htmlString=monitors.map((monitor,monitorIndex)=>{const config=statusConfig[monitor.statusClass||"unknown"]||statusConfig.paused,ratioInfo=monitor["90dRatio"]||{},monitorId=monitor.id||monitor.monitorId;if(monitor.statusClass==="danger"&&monitorId)downMonitors.push({id:monitorId,index:monitorIndex});return'<div class="monitor-row" data-index="'+monitorIndex+'"><span class="monitor-name">'+(monitor.name||"Unnamed")+'</span><span class="monitor-uptime" data-label="'+(ratioInfo.label||"good")+'">'+(ratioInfo.ratio!=null?formatPercent(ratioInfo.ratio):"—%")+'</span><div class="daily-bars">'+(Array.isArray(monitor.dailyRatios)?monitor.dailyRatios.slice(-barCount):[]).map(day=>'<div class="daily-bar" data-label="'+day.label+'" data-date="'+(day.date||"unknown")+'" data-ratio="'+(day.ratio!=null?formatPercent(day.ratio):"?%")+'"></div>').join("")+'</div><div class="monitor-status"><div class="dot dot-sm" data-status="'+config.status+'"><div class="core"></div><div class="ring"></div></div><span class="status-text" data-status="'+config.status+'">'+config.text+'</span></div></div>'}).join("");monitorCard.innerHTML=htmlString;if(isCompact){const containers=monitorCard.querySelectorAll(".daily-bars");for(const container of containers){container.style.display="grid";container.style.gridTemplateColumns=`repeat(${barCount},1fr)`;container.style.gap=gapWidth+"px"}}if(downMonitors.length){Promise.all(downMonitors.map(({id,index})=>fetch(`https://stats.uptimerobot.com/api/getMonitor/WHYtyVV51p?m=${id}`).then(response=>response.ok?response.json():null).then(errorData=>{const errorCode=errorData?.monitor?.logs?.[0]?.reason?.code;if(errorCode){const nameElement=monitorCard.querySelector(`.monitor-row[data-index="${index}"] .monitor-name`);if(nameElement)nameElement.innerHTML+=`<span class="err">${errorCode}`}}).catch(()=>{})))}};let isLoading=false;const fetchData=async(retryCount=0)=>{if(isLoading)return;isLoading=true;showPlaceholder("loading",retryCount===0?"⏳ Loading...":`⏳ Loading (retry ${retryCount}/3)...`);try{const response=await fetch("https://stats.uptimerobot.com/api/getMonitorList/WHYtyVV51p");if(!response.ok)throw new Error(`HTTP ${response.status}`);const responseData=await response.json();if(responseData.status==="ok"&&Array.isArray(responseData.data)){renderMonitors(responseData);isLoading=false;return}throw new Error("Invalid data format")}catch(error){if(retryCount<3)setTimeout(()=>fetchData(retryCount+1),2000*(retryCount+1));else{showPlaceholder("error",`❌ Failed to load: ${error.message}`);isLoading=false}}};fetchData(0)})();
